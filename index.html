<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEEPER: Into the Core</title>
<style>
:root{--bg:#07111e;--panel:#0d1d2e;--panel2:#102941;--line:#244762;--cyan:#70ddff;--text:#e9f5ff;--muted:#9ab1c5;--green:#72edb0;--gold:#ffd27c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#102c45,#07111e 65%);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button{background:#102b42;color:var(--text);border:1px solid #2b5572;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}button:hover{border-color:var(--cyan);background:#163c56}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#075475;border-color:#37bde8}.green{color:var(--green)}.gold{color:var(--gold)}.muted{color:var(--muted);font-size:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:15px 20px;background:#081624eF;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}.brand{font-size:24px;font-weight:950;letter-spacing:2px;color:var(--cyan)}.stats{display:flex;gap:18px;flex-wrap:wrap}.stat{font-size:11px;color:var(--muted)}.stat b{display:block;color:white;font-size:16px}.layout{display:grid;grid-template-columns:155px minmax(0,1fr);min-height:calc(100vh - 84px)}nav{padding:12px 9px;background:#081624;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}nav button{text-align:left;background:transparent;border-color:transparent}nav button.active{background:#10334b;border-color:#287aa0;color:var(--cyan)}main{padding:18px;min-width:0;max-width:1500px;width:100%;margin:0 auto}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 10px;color:#bdeaff}.hero,.card{border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#10263b,#0a1726);padding:15px;margin-bottom:12px}.hero{background:linear-gradient(120deg,#10314b,#17223b 65%,#2a1941);border-color:#2b7399}.big{font-size:32px;font-weight:900;color:var(--cyan);margin:7px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.place{min-height:128px;text-align:left;background:linear-gradient(150deg,#112b40,#0b1725)}.place.selected{border-color:var(--cyan);box-shadow:inset 0 0 0 1px #70ddff33}.place .emoji{font-size:26px;display:block;margin-bottom:6px}.place strong,.place small{display:block}.place small{color:var(--muted);margin-top:3px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}.bar{height:8px;border-radius:9px;background:#203348;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:linear-gradient(90deg,#22b7ed,#9b80ff)}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.item{border:1px solid #203f59;border-radius:8px;background:#0b1c2c;padding:10px}.item b{display:block;margin-bottom:5px}.item small{color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.notice{padding:10px 12px;background:#102f42;border:1px solid #2d7796;border-radius:8px;margin-bottom:12px;color:#9ceaff}.feed{max-height:230px;overflow:auto;color:#a9c2d4;font-size:12px}.footer{border-top:1px solid var(--line);padding:10px 18px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.hidden{display:none!important}input[type=file]{max-width:100%}
@media(max-width:700px){.top{position:static;align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}nav{display:grid;grid-template-columns:repeat(3,1fr);border-right:0;border-bottom:1px solid var(--line)}nav button{text-align:center;padding:8px 4px;font-size:12px}main{padding:10px}.grid{grid-template-columns:1fr}.map{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{gap:12px}.brand{font-size:20px}}
</style></head>
<body>
<header class="top"><div><div class="brand">◆ DEEPER</div><div class="muted">INTO THE CORE · Mining / Exploration / Industry</div></div><div class="stats"><div class="stat">CREDITS<b id="money">$600</b></div><div class="stat">DEPTH<b id="depth">0 m</b></div><div class="stat">ORES MINED<b id="mined">0</b></div><div class="stat">DISCOVERIES<b id="discoveries">0</b></div></div></header>
<div class="layout"><nav id="nav">
<button class="active" data-tab="mine">⛏ Mine</button><button data-tab="map">◈ World Map</button><button data-tab="sites">⌂ Outposts</button><button data-tab="factory">⚙ Factory</button><button data-tab="research">✧ Research</button><button data-tab="collection">▤ Collection</button><button data-tab="missions">☆ Missions</button><button data-tab="save">💾 Save / Load</button>
</nav><main><div id="notice" class="notice hidden"></div><div id="content"></div></main></div>
<footer class="footer"><span id="status">Mining network online.</span><span id="saveStatus">Autosave ready</span></footer>
<script>
(()=> {
'use strict';
const $=id=>document.getElementById(id), fmt=n=>Math.floor(n||0).toLocaleString('en-US'), cash=n=>'$'+fmt(n);
const zones=[
{id:'surface',name:'Surface Camp',icon:'🏕️',depth:0,cost:0,desc:'Your first camp. Build the foundation of your mining network.',ore:'Stone',value:3,hard:1},
{id:'crystal',name:'Crystal Caverns',icon:'💎',depth:250,cost:1200,desc:'Glowing crystal veins and valuable mineral clusters.',ore:'Crystal',value:24,hard:1.5},
{id:'forest',name:'Overgrown Sinkhole',icon:'🌿',depth:500,cost:6500,desc:'A lost ecosystem full of strange plants and rare materials.',ore:'Biomass',value:38,hard:1.8},
{id:'lab',name:'Abandoned Lab',icon:'🧪',depth:850,cost:18000,desc:'Recover research data and repair forgotten machinery.',ore:'Data Cores',value:85,hard:2.2},
{id:'desert',name:'Buried Desert City',icon:'🏛️',depth:1200,cost:42000,desc:'Ancient ruins, relics, and buried treasure.',ore:'Relics',value:140,hard:2.5},
{id:'ice',name:'Glacier Vault',icon:'❄️',depth:1900,cost:90000,desc:'Frozen caverns hiding high-value minerals.',ore:'Frost Gems',value:220,hard:3},
{id:'lava',name:'Lava Fields',icon:'🌋',depth:2800,cost:180000,desc:'Dangerous heat, rare alloys, and volcanic glass.',ore:'Obsidian',value:360,hard:3.8},
{id:'alien',name:'Alien Facility',icon:'👽',depth:4100,cost:420000,desc:'Unknown technology and powerful energy crystals.',ore:'Xenocrystal',value:650,hard:4.5},
{id:'ocean',name:'Subterranean Sea',icon:'🌊',depth:5600,cost:850000,desc:'An underground ocean with pressure-resistant minerals.',ore:'Abyssal Pearl',value:980,hard:5.2},
{id:'ruins',name:'Shattered Ruins',icon:'🗿',depth:7300,cost:1700000,desc:'Fragments of a civilization buried far below.',ore:'Ancient Alloy',value:1500,hard:6},
{id:'storm',name:'Storm Reactor',icon:'⚡',depth:9800,cost:3600000,desc:'Harness unstable energy to power the network.',ore:'Storm Cells',value:2600,hard:7.5},
{id:'core',name:'The Core',icon:'☀️',depth:12500,cost:8000000,desc:'The deepest known zone. The greatest discovery awaits.',ore:'Core Shards',value:5000,hard:10}
];
const ores=['Stone','Coal','Copper','Iron','Tin','Silver','Gold','Quartz','Crystal','Titanium','Platinum','Uranium','Obsidian','Cobalt','Lithium','Nickel','Tungsten','Iridium','Palladium','Rhodium','Biomass','Data Cores','Relics','Frost Gems','Xenocrystal','Abyssal Pearl','Ancient Alloy','Storm Cells','Core Shards','Void Matter'];
const upgrades=['Drill Power','Drill Speed','Ore Scanner','Cargo Capacity','Deep-Core Bit','Cooling System','Auto-Sorter','Crystal Lens','Seismic Radar','Hydraulic Arm','Plasma Cutter','Laser Array','Magma Shield','Pressure Hull','Quantum Drill','Nano-Extractor','AI Mining','Ore Compressor','Smart Conveyor','Fusion Engine','Reinforced Casing','Precision Head','Dual Drill','Triple Drill','Excavator Rig','Mineral Washer','Ore Magnet','Deep Scan','Echo Locator','Power Coupler','Heat Sink','Energy Bank','Robotic Crew','Survey Drone','Repair Bot','Cargo Drone','Mining Mech','Automated Lift','Core Stabilizer','Warp Bore'];
const research=['Geology','Automation','Material Science','Energy Storage','Artificial Intelligence','Alien Technology','Ancient History','Robotics','Thermal Control','Deep Pressure','Crystal Resonance','Quantum Mechanics','Drone Navigation','Industrial Design','Resource Forecasting','Dimensional Mapping','Fusion Power','Rare Ore Analysis','Seismic Imaging','Core Physics'];
const machines=['Smelter','Refinery','Crystal Lab','Machine Shop','Power Plant','Ore Washer','Alloy Forge','Research Lab','Drone Hangar','Cargo Depot','Fusion Plant','Artifact Archive'];
const fresh=()=>({money:600,depth:0,progress:0,mined:0,discovered:0,active:'surface',tab:'mine',unlocked:['surface'],ore:{Stone:0},totalOre:{},upgrades:{},research:{},buildings:{},siteLevels:{surface:1},siteBank:{},collection:[],missionsDone:[],feed:['Welcome to DEEPER. Start mining, sell materials, and explore new zones.'],carry:0,lastTime:Date.now()});
let s=fresh(),noticeTimer;
function note(t){s.feed.unshift(t);s.feed=s.feed.slice(0,50);$('notice').textContent=t;$('notice').classList.remove('hidden');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').classList.add('hidden'),5000)}
function zone(){return zones.find(z=>z.id===s.active)||zones[0]}
function level(n){return s.upgrades[n]||0}
function rate(){return (1+level('Drill Power')*1.25+level('Deep-Core Bit')*2+level('Plasma Cutter')*5+level('Quantum Drill')*12+level('Dual Drill')*4+level('Triple Drill')*12)*(1+level('Drill Speed')*.2+level('AI Mining')*.35+level('Robotic Crew')*.5)}
function income(z){if(!s.unlocked.includes(z.id))return 0;let b=machines.reduce((a,n)=>a+(s.buildings[z.id+'|'+n]||0),0);return ((s.siteLevels[z.id]||1)*.18+b*.12)*z.value*(1+(s.research['Resource Forecasting']||0)*.15)}
function totalBuildings(){return Object.values(s.buildings).reduce((a,b)=>a+b,0)}
function totalResearch(){return Object.values(s.research).reduce((a,b)=>a+b,0)}
function updateTop(){$('money').textContent=cash(s.money);$('depth').textContent=fmt(s.depth)+' m';$('mined').textContent=fmt(s.mined);$('discoveries').textContent=fmt(s.discovered);$('status').textContent=zone().name+' · '+fmt(rate()*10)+' units/min · '+s.unlocked.length+'/'+zones.length+' zones';}
function save(silent=false){try{localStorage.setItem('deeper-core-save-v1',JSON.stringify(s));$('saveStatus').textContent='Saved locally · '+new Date().toLocaleTimeString();if(!silent)note('Game saved on this browser.')}catch(e){$('saveStatus').textContent='Browser storage blocked. Use Export Save.';if(!silent)note('Local save failed. Use Export Save to keep a backup.')}}
function loadLocal(){try{const raw=localStorage.getItem('deeper-core-save-v1');if(!raw)return false;const x=JSON.parse(raw);if(!x||!Array.isArray(x.unlocked)||typeof x.money!=='number')return false;s=Object.assign(fresh(),x);return true}catch(e){return false}}
function mine(){const z=zone(),n=z.ore,q=Math.max(1,Math.floor(rate()));s.ore[n]=(s.ore[n]||0)+q;s.totalOre[n]=(s.totalOre[n]||0)+q;s.mined+=q;s.progress+=q*.7/z.hard;if(s.progress>=10){s.progress=0;s.depth+=Math.max(1,Math.floor((1+level('Drill Power')*.2)*z.hard));}if(Math.random()<Math.min(.3,.04+level('Ore Scanner')*.012)){s.collection.push('Hidden deposit in '+z.name);s.discovered++;const bonus=z.value*3;s.money+=bonus;note('Hidden deposit found! Bonus '+cash(bonus)+'.')}render();save(true)}
function sell(){let v=0;for(const n in s.ore){let idx=ores.indexOf(n);v+=(s.ore[n]||0)*Math.max(3+Math.max(0,idx)*7,zone().value*.25);s.ore[n]=0}if(v<=0){note('Your cargo is empty. Mine some materials first.');return}s.money+=Math.floor(v);note('Sold cargo for '+cash(v)+'.');render();save(true)}
function unlock(id){const z=zones.find(a=>a.id===id);if(!z)return;if(s.unlocked.includes(id)){s.active=id;s.tab='sites';render();return}if(s.depth<z.depth){note('Reach '+fmt(z.depth)+' meters first.');return}if(s.money<z.cost){note('You need '+cash(z.cost-s.money)+' more credits.');return}s.money-=z.cost;s.unlocked.push(id);s.siteLevels[id]=1;s.siteBank[id]=0;s.discovered++;s.collection.push('Location discovered: '+z.name);s.active=id;s.tab='sites';note('New location unlocked: '+z.name);render();save(true)}
function buyUpgrade(n){let l=level(n),c=Math.floor(80*Math.pow(1.48,l)*(1+upgrades.indexOf(n)*.13));if(s.money<c){note('Not enough credits.');return}s.money-=c;s.upgrades[n]=l+1;note(n+' upgraded to level '+(l+1)+'.');render();save(true)}
function buyResearch(n){let l=s.research[n]||0,c=Math.floor(350*Math.pow(1.85,l)*(1+research.indexOf(n)*.15));if(s.money<c){note('Not enough credits.');return}s.money-=c;s.research[n]=l+1;note('Research completed: '+n+'.');render();save(true)}
function build(n){let k=s.active+'|'+n,l=s.buildings[k]||0,c=Math.floor(500*Math.pow(1.7,l)*(1+machines.indexOf(n)*.25));if(s.money<c){note('Not enough credits.');return}s.money-=c;s.buildings[k]=l+1;note(n+' upgraded at '+zone().name+'.');render();save(true)}
function improve(){let z=zone(),l=s.siteLevels[z.id]||1,c=Math.floor(900*Math.pow(1.85,l-1)*(z.depth+1));if(s.money<c){note('Not enough credits.');return}s.money-=c;s.siteLevels[z.id]=l+1;note(z.name+' expanded to level '+(l+1)+'.');render();save(true)}
function switchTab(t){s.tab=t;render()}
function render(){updateTop();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===s.tab));let z=zone(),h='';
if(s.tab==='mine')h=`<section class="hero"><div class="muted">CURRENT ZONE · ${z.name.toUpperCase()}</div><h1>${z.icon} ${z.name}</h1><div class="big">${fmt(s.depth)} m</div><div class="muted">${z.desc}</div><div class="row"><span>Mining speed</span><b>${fmt(rate()*10)} units/min</b></div><div class="bar"><span style="width:${Math.min(100,s.progress*10)}%"></span></div><div class="row muted"><span>Drilling progress</span><span>${Math.floor(s.progress*10)}%</span></div><div class="actions"><button class="primary" data-act="mine">⛏ Mine now</button><button data-act="sell">Sell all cargo</button><button data-act="tab" data-tab="map">Explore map →</button></div></section><div class="grid"><section class="card"><h2>Current deposit</h2><div class="big">${fmt(s.ore[z.ore]||0)}</div><b>${z.ore}</b><p class="muted">Mine materials and sell them to fund better equipment and new destinations.</p></section><section class="card"><h2>Mining network</h2><div class="row"><span>Zones unlocked</span><b>${s.unlocked.length}/${zones.length}</b></div><div class="row"><span>Equipment levels</span><b>${Object.values(s.upgrades).reduce((a,b)=>a+b,0)}</b></div><div class="row"><span>Research levels</span><b>${totalResearch()}</b></div><div class="row"><span>Factory levels</span><b>${totalBuildings()}</b></div></section><section class="card" style="grid-column:1/-1"><h2>Next destinations</h2><div class="items">${zones.filter(a=>!s.unlocked.includes(a.id)).slice(0,4).map(a=>`<div class="item"><b>${a.icon} ${a.name}</b><small>Requires ${fmt(a.depth)} m · ${cash(a.cost)}</small><div class="actions"><button data-act="inspect" data-id="${a.id}">View on map</button></div></div>`).join('')||'All current locations unlocked!'}</div></section></div>`;
else if(s.tab==='map')h=`<div class="head"><div><h1>Interactive World Map</h1><div class="muted">Choose a destination to inspect, unlock, or travel there.</div></div><b class="gold">${s.unlocked.length}/${zones.length} discovered</b></div><div class="map">${zones.map(a=>{let on=s.unlocked.includes(a.id);return `<button class="place ${a.id===s.active?'selected':''}" data-act="inspect" data-id="${a.id}"><span class="emoji">${on?a.icon:'🔒'}</span><strong>${a.name}</strong><small>${fmt(a.depth)} m region</small><small>${on?'Income '+cash(income(a))+'/sec':fmt(a.depth)+' m · '+cash(a.cost)}</small></button>`}).join('')}</div><section class="card" style="margin-top:12px"><h2>${z.icon} ${z.name}</h2><p class="muted">${z.desc}</p><div class="row"><span>Depth requirement</span><b>${fmt(z.depth)} m</b></div><div class="row"><span>Unlock cost</span><b>${cash(z.cost)}</b></div><div class="row"><span>Local material</span><b>${z.ore}</b></div><div class="actions">${s.unlocked.includes(z.id)?'<button class="primary" data-act="switch">Travel here</button>':`<button class="primary" data-act="unlock" data-id="${z.id}" ${s.depth<z.depth||s.money<z.cost?'disabled':''}>Unlock location</button>`}<button data-act="tab" data-tab="sites">Manage outposts</button></div></section>`;
else if(s.tab==='sites')h=`<div class="head"><div><h1>Outpost Network</h1><div class="muted">Your unlocked places earn money while you mine elsewhere.</div></div><span class="green">Passive income enabled</span></div><div class="map">${zones.filter(a=>s.unlocked.includes(a.id)).map(a=>`<button class="place ${a.id===s.active?'selected':''}" data-act="switchTo" data-id="${a.id}"><span class="emoji">${a.icon}</span><strong>${a.name}</strong><small>Level ${s.siteLevels[a.id]||1}</small><small>${cash(income(a))}/sec income</small></button>`).join('')}</div><section class="card" style="margin-top:12px"><h2>${z.icon} ${z.name} management</h2><div class="row"><span>Outpost level</span><b>${s.siteLevels[z.id]||1}</b></div><div class="row"><span>Income</span><b class="green">${cash(income(z))}/sec</b></div><div class="row"><span>Stored income</span><b>${cash(s.siteBank[z.id]||0)}</b></div><div class="actions"><button class="primary" data-act="improve">Expand outpost · ${cash(Math.floor(900*Math.pow(1.85,(s.siteLevels[z.id]||1)-1)*(z.depth+1)))}</button><button data-act="collect">Collect stored income</button><button data-act="tab" data-tab="mine">Return to mining</button></div></section>`;
else if(s.tab==='factory')h=`<div class="head"><div><h1>Industrial Factory</h1><div class="muted">Build machines at the selected outpost.</div></div><span>${z.icon} ${z.name}</span></div><div class="grid">${machines.map((n,i)=>{let k=z.id+'|'+n,l=s.buildings[k]||0,c=Math.floor(500*Math.pow(1.7,l)*(1+i*.25));return `<section class="card"><h2>${['🔥','⚗️','💎','🔩','⚡','🧼','🛠️','🧬','🚁','📦','☀️','🏺'][i]} ${n}</h2><div class="row"><span>Level</span><b>${l}</b></div><p class="muted">Adds production value to this outpost's passive income.</p><button class="primary" data-act="build" data-name="${n}" ${s.money<c?'disabled':''}>Build / upgrade · ${cash(c)}</button></section>`}).join('')}</div>`;
else if(s.tab==='research')h=`<div class="head"><div><h1>Research Tree</h1><div class="muted">Research improves your entire mining network.</div></div><span class="gold">20 branches</span></div><div class="grid">${research.map((n,i)=>{let l=s.research[n]||0,c=Math.floor(350*Math.pow(1.85,l)*(1+i*.15));return `<section class="card"><h2>✧ ${n}</h2><div class="row"><span>Level</span><b>${l}</b></div><div class="bar"><span style="width:${Math.min(100,l*12)}%"></span></div><p class="muted">Develop technology to improve efficiency and unlock more powerful systems.</p><button class="primary" data-act="research" data-name="${n}" ${s.money<c?'disabled':''}>Research · ${cash(c)}</button></section>`}).join('')}</div>`;
else if(s.tab==='collection')h=`<div class="head"><div><h1>Ore & Discovery Collection</h1><div class="muted">Track materials mined and discoveries found.</div></div><span>${ores.length} materials</span></div><section class="card"><h2>Mineral Index</h2><div class="items">${ores.map((n,i)=>`<div class="item"><b>${s.totalOre[n]?'◆':'◇'} ${n}</b><small>${s.totalOre[n]?fmt(s.totalOre[n])+' collected':'Not discovered'} · Tier ${Math.floor(i/5)+1}</small></div>`).join('')}</div></section><section class="card"><h2>Discoveries · ${s.collection.length}</h2><div class="feed">${s.collection.length?s.collection.map(x=>'✦ '+escapeHtml(x)).join('<br>'):'No discoveries yet. Mine deposits and unlock locations.'}</div></section>`;
else if(s.tab==='missions'){const ms=[['m1','Break the Surface','Mine 100 materials.',s.mined>=100,500],['m2','Deep Diver','Reach 500 meters.',s.depth>=500,1800],['m3','Explorer','Unlock 3 locations.',s.unlocked.length>=3,3500],['m4','Industrialist','Build 5 machine levels.',totalBuildings()>=5,5000],['m5','Scientist','Complete 5 research levels.',totalResearch()>=5,6500],['m6','Cartographer','Unlock 6 locations.',s.unlocked.length>=6,14000],['m7','Core Seeker','Reach 5,000 meters.',s.depth>=5000,50000],['m8','Master Miner','Mine 10,000 materials.',s.mined>=10000,100000]];h=`<div class="head"><div><h1>Missions & Contracts</h1><div class="muted">Complete milestones to fund your next expansion.</div></div><span>${s.missionsDone.length}/${ms.length} claimed</span></div><div class="grid">${ms.map(m=>`<section class="card"><h2>${m[3]?'✓':'☆'} ${m[1]}</h2><p class="muted">${m[2]}</p><div class="row"><span>Reward</span><b class="gold">${cash(m[4])}</b></div><button class="primary" data-act="mission" data-id="${m[0]}" ${!m[3]||s.missionsDone.includes(m[0])?'disabled':''}>${s.missionsDone.includes(m[0])?'Reward claimed':m[3]?'Claim reward':'In progress'}</button></section>`).join('')}</div>`}
else h=`<h1>Save & Load</h1><p class="muted">Your game autosaves in this browser. Export a backup to move your save to another device.</p><section class="card"><h2>Local Save</h2><div class="actions"><button class="primary" data-act="save">Save now</button><button data-act="load">Load local save</button><button data-act="reset">New game / reset</button></div></section><section class="card"><h2>Portable Save File</h2><div class="actions"><button class="primary" data-act="export">Export save file</button><label><input id="importFile" type="file" accept=".json,application/json"></label><button data-act="import">Import selected file</button></div><p class="muted">Keep the downloaded JSON file somewhere safe. Importing a save replaces current progress.</p></section>`;
$('content').innerHTML=h;
}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function exportSave(){const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='deeper-save.json';a.click();URL.revokeObjectURL(url);note('Save exported. Keep deeper-save.json as a backup.')}
function importSave(file){if(!file){note('Choose a JSON save file first.');return}const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x.money!=='number'||!Array.isArray(x.unlocked))throw Error('Invalid save');s=Object.assign(fresh(),x);save(true);render();note('Save imported successfully.')}catch(e){note('That file does not look like a DEEPER save.')}};r.readAsText(file)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){switchTab(b.dataset.tab);return}const a=b.dataset.act,id=b.dataset.id;switch(a){case'mine':mine();break;case'sell':sell();break;case'tab':switchTab(b.dataset.tab);break;case'inspect':if(id){s.active=id;s.tab='map';render()}break;case'unlock':unlock(id);break;case'switch':s.tab='sites';render();note('You are now at '+zone().name+'.');break;case'switchTo':if(s.unlocked.includes(id)){s.active=id;render();note('Travelled to '+zone().name+'.')}break;case'improve':improve();break;case'collect':{let v=Math.floor(s.siteBank[s.active]||0);if(v>0){s.money+=v;s.siteBank[s.active]-=v;note('Collected '+cash(v)+'.');render();save(true)}else note('No stored income yet.');break}case'build':build(b.dataset.name);break;case'research':buyResearch(b.dataset.name);break;case'mission':{const conditions={m1:[s.mined>=100,500],m2:[s.depth>=500,1800],m3:[s.unlocked.length>=3,3500],m4:[totalBuildings()>=5,5000],m5:[totalResearch()>=5,6500],m6:[s.unlocked.length>=6,14000],m7:[s.depth>=5000,50000],m8:[s.mined>=10000,100000]},m=conditions[id];if(m&&m[0]&&!s.missionsDone.includes(id)){s.missionsDone.push(id);s.money+=m[1];note('Mission completed! '+cash(m[1])+' earned.');render();save(true)}break}case'save':save();break;case'load':if(loadLocal()){render();note('Local save loaded.')}else note('No valid local save found.');break;case'export':exportSave();break;case'import':importSave($('importFile').files[0]);break;case'reset':if(confirm('Start a new game? Export your save first if you want to keep it.')){s=fresh();save(true);render();note('New game started.')}break}});
let last=Date.now();setInterval(()=>{let now=Date.now(),dt=Math.min(5,(now-last)/1000);last=now;if(dt<=0)return;const z=zone();s.carry+=rate()*.1*dt;let q=Math.floor(s.carry);if(q>0){s.carry-=q;s.ore[z.ore]=(s.ore[z.ore]||0)+q;s.totalOre[z.ore]=(s.totalOre[z.ore]||0)+q;s.mined+=q;s.progress+=q*.12/z.hard;if(s.progress>=10){s.progress=0;s.depth+=Math.max(1,Math.floor(z.hard))}}for(const p of zones){if(s.unlocked.includes(p.id))s.siteBank[p.id]=(s.siteBank[p.id]||0)+income(p)*dt}let payout=0;for(const id in s.siteBank){let v=Math.floor(s.siteBank[id]);if(v>0){payout+=v;s.siteBank[id]-=v}}s.money+=payout;updateTop();if(Math.floor(now/1000)%10===0)save(true)},1000);
if(loadLocal())note('Welcome back! Your local save was loaded.');render();save(true);
})();
</script></body></html>
